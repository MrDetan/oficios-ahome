<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#brandGrad)" />
  
  <!-- Outer subtle civic ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="16 12" />

  <!-- House roof silhouette -->
  <path d="M 120 250 L 256 130 L 392 250" fill="none" stroke="#f8fafc" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Crossed Tools: Wrench & Hammer in Accent Green & Pure White -->
  <!-- Wrench -->
  <g transform="translate(256, 280) rotate(-40) translate(-256, -280)">
    <path d="M 230 190 C 215 190 205 205 205 220 C 205 232 212 242 222 247 L 222 360 C 222 368 228 375 236 375 L 256 375 C 264 375 270 368 270 360 L 270 247 C 280 242 287 232 287 220 C 287 205 277 190 262 190 L 254 212 L 238 212 Z" fill="#10b981" />
  </g>

  <!-- Hammer -->
  <g transform="translate(256, 280) rotate(40) translate(-256, -280)">
    <!-- Handle -->
    <rect x="246" y="210" width="20" height="165" rx="10" fill="#f8fafc" />
    <!-- Head -->
    <path d="M 215 180 L 297 180 C 304 180 310 186 310 193 L 310 215 C 310 220 305 225 300 225 L 212 225 C 207 225 202 220 202 215 L 202 193 C 202 186 208 180 215 180 Z" fill="#f8fafc" />
  </g>

  <!-- Community Dot / Trust Seal -->
  <circle cx="256" cy="410" r="16" fill="#10b981" />
  <circle cx="216" cy="410" r="8" fill="#64748b" />
  <circle cx="296" cy="410" r="8" fill="#64748b" />
</svg>
