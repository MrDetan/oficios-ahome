name: ⚠️ Reportar número inactivo o cambio de oficio
description: Ayúdanos a mantener la base de datos limpia reportando un número fuera de servicio.
title: "[REPORTE]: Número inactivo / cambio en ID "
labels: ["moderacion", "revision-datos"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por colaborar con la comunidad de Ahome para mantener el directorio limpio y confiable.
  - type: input
    id: oficio_id
    attributes:
      label: ID o Nombre del Oficio
      description: Ejemplo: "OF-014" o "Herrería Don Beto - Álamos Country".
      placeholder: "ID o Nombre"
    validations:
      required: true
  - type: dropdown
    id: motivo
    attributes:
      label: Motivo del reporte
      options:
        - "El número no existe o marca fuera de servicio"
        - "La persona ya no se dedica a este oficio"
        - "Número equivocado / pertenece a otra persona"
        - "Cobro indebido o comportamiento no ético"
        - "Otro"
    validations:
      required: true
  - type: textarea
    id: detalles
    attributes:
      label: Detalles adicionales (Opcional)
      placeholder: Describe brevemente la situación o si tienes el número nuevo correcto.
