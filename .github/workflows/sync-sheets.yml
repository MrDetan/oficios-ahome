name: Sync Google Sheets Oficios Database

on:
  schedule:
    # Sincronización automática diaria a las 06:00 UTC (medianoche en Sinaloa)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub Actions

permissions:
  contents: write

jobs:
  sync-database:
    name: Fetch & Validate Oficios Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar base de datos desde Google Apps Script
        run: |
          node -e "
          const fs = require('fs');
          const https = require('https');

          const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbyKZGja4fVGI-pvVEEhD2NGfLtF9mZ9Ox-CM16wlc_SVyAPc3vt5_whSPifrdLHB4_x/exec';

          function fetchWithRedirect(url, maxRedirects = 5) {
            return new Promise((resolve, reject) => {
              if (maxRedirects === 0) return reject(new Error('Demasiadas redirecciones'));
              https.get(url, (res) => {
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                  return resolve(fetchWithRedirect(res.headers.location, maxRedirects - 1));
                }
                if (res.statusCode !== 200) {
                  return reject(new Error('HTTP Status ' + res.statusCode));
                }
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(data));
              }).on('error', reject);
            });
          }

          async function sync() {
            try {
              console.log('Consultando Webhook de Google Sheets...');
              const raw = await fetchWithRedirect(WEBHOOK_URL);
              const json = JSON.parse(raw);
              if (!Array.isArray(json) || json.length === 0) {
                throw new Error('Formato inválido o arreglo vacío recibido de Sheets');
              }
              console.log('Se recibieron ' + json.length + ' oficios correctamente.');
              fs.writeFileSync('oficios.json', JSON.stringify(json, null, 2), 'utf8');
              console.log('oficios.json actualizado con éxito.');
            } catch (err) {
              console.error('Error durante la sincronización:', err.message);
              process.exit(1);
            }
          }
          sync();
          "

      - name: Validar esquema y calidad de datos
        run: node scripts/validate-data.js

      - name: Verificar cambios y hacer Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oficios.json
          if git diff --staged --quiet; then
            echo "No se detectaron cambios en la base de datos de oficios."
          else
            git commit -m "chore(data): sincronización automática diaria de oficios desde Google Sheets"
            git push
            echo "Cambios sincronizados y subidos a la rama principal."
          fi
